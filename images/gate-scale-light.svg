<svg xmlns="http://www.w3.org/2000/svg" width="680" height="298" viewBox="0 0 680 298" role="img" aria-label="Scaled gates for the three octagon presets">
<title>Scaled gates for the three octagon presets</title>
<desc>Three panels sharing one scale. Each shows a dashed circle of full stick deflection and the gate left where its corner position puts it, with arrows from the circle to the gate marking where a fully deflected stick lands. Arrows run outward for the square and N64 gates and inward for the regular one.</desc>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
  <path d="M0,0 L8,4 L0,8 z" fill="#1D9E75"/></marker></defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .col   { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
  .label { font-size: 11px; fill: #5F5E5A; }
  .axis  { stroke: #B4B2A9; stroke-width: 0.5; }
  .hair  { fill: none; stroke: #888780; stroke-width: 0.75; stroke-dasharray: 4 4; opacity: 0.6; }
  .gate  { fill: #D85A30; fill-opacity: 0.10; stroke: #D85A30; stroke-width: 1.5; stroke-linejoin: round; }
  .dead  { fill: #D85A30; fill-opacity: 0.28; stroke: none; }
  .arrow { stroke: #1D9E75; stroke-width: 1.3; fill: none; }
</style>
