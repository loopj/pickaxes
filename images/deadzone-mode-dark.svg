<svg xmlns="http://www.w3.org/2000/svg" width="680" height="368" viewBox="0 0 680 368" role="img" aria-label="Unscaled and scaled deadzone response curves">
<title>Unscaled and scaled deadzone response</title>
<desc>Two plots of output against raw deflection. The unscaled curve jumps at the inner threshold and again at the outer threshold. The scaled curve ramps continuously from the inner threshold to the outer one.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 14px; font-weight: 500; fill: #F1EFE8; }
  .label { font-size: 12px; font-weight: 400; fill: #C2C0B6; }
  .panel { fill: none; stroke: #6B6A65; stroke-width: 0.5; }
  .inner { fill: #F5C4B3; opacity: 0.58; }
  .outer { fill: #9FE1CB; opacity: 0.58; }
  .key-i { fill: #F5C4B3; opacity: 0.85; }
  .key-o { fill: #9FE1CB; opacity: 0.85; }
  .curve { fill: none; stroke: #F1EFE8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .riser { fill: none; stroke: #F1EFE8; stroke-width: 1; stroke-dasharray: 2 2; opacity: 0.6; }
</style>

<text class="title" x="190" y="34" text-anchor="middle">Unscaled</text>
<text class="title" x="490" y="34" text-anchor="middle">Scaled</text>

<rect class="panel" x="70" y="54" width="240" height="240" rx="4"/>
<rect class="inner" x="70" y="54" width="27" height="240"/>
<rect class="outer" x="283" y="54" width="27" height="240"/>
<path class="curve" d="M74 290 H97"/>
<path class="riser" d="M97 290 V267"/>
<path class="curve" d="M97 267 L283 81"/>
<path class="riser" d="M283 81 V58"/>
<path class="curve" d="M283 58 H306"/>

<rect class="panel" x="370" y="54" width="240" height="240" rx="4"/>
<rect class="inner" x="370" y="54" width="27" height="240"/>
<rect class="outer" x="583" y="54" width="27" height="240"/>
<path class="curve" d="M374 290 H397 L583 58 H606"/>

<rect class="key-i" x="166" y="317" width="11" height="11"/>
<text class="label" x="183" y="326">Inner deadzone</text>
<rect class="key-o" x="309" y="317" width="11" height="11"/>
<text class="label" x="326" y="326">Outer deadzone</text>
<line x1="452" y1="322" x2="466" y2="322" stroke="#F1EFE8" stroke-width="2" stroke-linecap="round"/>
<text class="label" x="472" y="326">Output</text>

<text class="label" x="340" y="344" text-anchor="middle">Horizontal axis: raw deflection. Vertical axis: output.</text>
</svg>
