<svg xmlns="http://www.w3.org/2000/svg" width="680" height="298" viewBox="0 0 680 298" role="img" aria-label="Clamped gates for the three octagon presets">
<title>Clamped gates for the three octagon presets</title>
<desc>Three panels sharing one scale. Each shows a dashed circle of full stick deflection and the gate shrunk to fit inside it, with the ring between them shaded as travel that reads fully deflected. The regular octagon already fits, so nothing is shrunk.</desc>
